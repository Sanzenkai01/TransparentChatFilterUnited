name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained executable
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish .\TransparentChatFilter.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version `
            -o .\publish
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $archive = Join-Path $env:RUNNER_TEMP "TransparentChatFilterUnited-win-x64.zip"
          Compress-Archive -Path .\publish\TransparentChatFilterUnited.exe -DestinationPath $archive
          "RELEASE_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $env:RELEASE_ARCHIVE --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $env:RELEASE_ARCHIVE `
              --title "TransparentChatFilterUnited $env:GITHUB_REF_NAME" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
